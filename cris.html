<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Una pregunta para ti ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffb6d9,#ffe0ec);
}

.card{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:500px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    z-index:10;
}

h1{
    color:#ff4f8b;
    margin-bottom:15px;
}

p{
    color:#666;
    margin-bottom:20px;
}

#message{
    color:#ff4f8b;
    font-weight:bold;
    min-height:30px;
    margin-bottom:20px;
}

.buttons{
    position:relative;
    height:120px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:15px;
    padding:15px 30px;
    font-size:18px;
    transition:0.2s;
}

#yes{
    background:#ff4f8b;
    color:white;
}

#no{
    background:#e9e9e9;
    position:absolute;
    left:220px;
    top:0;
    z-index:999;
}

.heart{
    position:absolute;
    pointer-events:none;
    animation:float linear forwards;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="card" id="card">

    <h1>❤️ Tengo una pregunta ❤️</h1>

    <p>¿Te gustaría salir conmigo?</p>

    <div id="message">
        Prometo que valdrá la pena 🥰
    </div>

    <div class="buttons">
        <button id="yes">Sí ❤️</button>
        <button id="no">No 😢</button>
    </div>

</div>

<script>

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const message = document.getElementById("message");

let scale = 1;

const frases = [
    "¿Segura? 🥺",
    "Piénsalo otra vez ❤️",
    "¿Completamente segura? 😭",
    "No me rompas el corazón 💔",
    "Vamos, di que sí 🥰",
    "Prometo invitar algo rico 🍕",
    "El botón correcto es Sí 😎",
    "Ya casi te convenzo 😁",
    "¿Por qué intentas presionar No? 😭",
    "La respuesta está clarísima ❤️"
];

let intentos = 0;

function moverBoton(){

    intentos++;

    message.textContent =
    frases[intentos % frases.length];

    scale += 0.08;

    yesBtn.style.transform =
    `scale(${scale})`;

    const margen = 20;

    const maxX =
    window.innerWidth -
    noBtn.offsetWidth -
    margen;

    const maxY =
    window.innerHeight -
    noBtn.offsetHeight -
    margen;

    const x =
    Math.random() * maxX;

    const y =
    Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseenter", moverBoton);
noBtn.addEventListener("click", moverBoton);
noBtn.addEventListener("touchstart", moverBoton);

yesBtn.addEventListener("click", () => {

    document.body.innerHTML = `
        <div style="
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ffb6d9,#ffe0ec);
            text-align:center;
        ">
            <h1 style="
                color:#ff4f8b;
                font-size:3rem;
                margin-bottom:20px;
            ">
                💖 ¡Sabía que dirías que sí! 💖
            </h1>

            <h2 style="color:#666;">
                ❤️ Gracias por aceptar ❤️
            </h2>
        </div>
    `;

    for(let i=0;i<150;i++){

        setTimeout(()=>{

            const heart =
            document.createElement("div");

            heart.innerHTML = "❤️";

            heart.style.position = "fixed";
            heart.style.left =
            Math.random()*100 + "vw";

            heart.style.top =
            Math.random()*100 + "vh";

            heart.style.fontSize =
            (20 + Math.random()*50)+"px";

            document.body.appendChild(heart);

        },i*40);
    }

});

function crearCorazon(){

    const heart =
    document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "❤️";

    heart.style.left =
    Math.random()*100 + "vw";

    heart.style.fontSize =
    (15 + Math.random()*35)+"px";

    heart.style.animationDuration =
    (4 + Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);
}

setInterval(crearCorazon,250);

</script>

</body>
</html>
